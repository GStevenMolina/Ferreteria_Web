{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="{% static 'css/change_password.css' %}">
</head>

<body class="cp">
  <main class="cp__wrap">
    <section class="cp__panel" aria-label="Cambiar contraseña">

      <div class="cp__header">
        <div class="cp__logoSphere" aria-hidden="true">
          <img class="cp__logo" src="{% static 'assets/Ferreteria.png' %}" alt="Ferretería Mi Casa">
        </div>

        <h1 class="cp__title">Cambiar contraseña</h1>
        <p class="cp__subtitle">Actualiza tu contraseña para mantener tu cuenta segura.</p>
      </div>

      {% if messages %}
        <div class="cp__alerts">
          {% for message in messages %}
            <div class="cp__alert">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      <form class="cp__form" method="post">
        {% csrf_token %}

        <label class="cp__field">
          <span class="cp__label">Contraseña actual</span>
          <div class="cp__inputWrap">
            <input id="cp_current" class="cp__input" type="password" name="current_password" autocomplete="current-password" required>
            <button type="button" class="cp__toggle" data-toggle-for="cp_current" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <!-- ojo -->
              <svg class="cp__eye" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <!-- ojo tachado -->
              <svg class="cp__eyeOff" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none;">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2"/>
                <path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.4" stroke="currentColor" stroke-width="2"/>
                <path d="M6.3 6.3C3.8 8.3 2 12 2 12s3.5 7 10 7c2.1 0 3.9-.6 5.4-1.5" stroke="currentColor" stroke-width="2"/>
                <path d="M9.9 4.2C10.6 4.1 11.3 4 12 4c6.5 0 10 8 10 8s-1 2.3-3.1 4.4" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </label>

        <label class="cp__field">
          <span class="cp__label">Nueva contraseña</span>
          <div class="cp__inputWrap">
            <input id="cp_new" class="cp__input" type="password" name="new_password" autocomplete="new-password" required>
            <button type="button" class="cp__toggle" data-toggle-for="cp_new" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg class="cp__eye" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg class="cp__eyeOff" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none;">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2"/>
                <path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.4" stroke="currentColor" stroke-width="2"/>
                <path d="M6.3 6.3C3.8 8.3 2 12 2 12s3.5 7 10 7c2.1 0 3.9-.6 5.4-1.5" stroke="currentColor" stroke-width="2"/>
                <path d="M9.9 4.2C10.6 4.1 11.3 4 12 4c6.5 0 10 8 10 8s-1 2.3-3.1 4.4" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </label>

        <label class="cp__field">
          <span class="cp__label">Confirmar nueva contraseña</span>
          <div class="cp__inputWrap">
            <input id="cp_new2" class="cp__input" type="password" name="new_password2" autocomplete="new-password" required>
            <button type="button" class="cp__toggle" data-toggle-for="cp_new2" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg class="cp__eye" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg class="cp__eyeOff" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none;">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2"/>
                <path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.4" stroke="currentColor" stroke-width="2"/>
                <path d="M6.3 6.3C3.8 8.3 2 12 2 12s3.5 7 10 7c2.1 0 3.9-.6 5.4-1.5" stroke="currentColor" stroke-width="2"/>
                <path d="M9.9 4.2C10.6 4.1 11.3 4 12 4c6.5 0 10 8 10 8s-1 2.3-3.1 4.4" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </label>

        <button class="cp__btn" type="submit">Guardar</button>

        <a class="cp__back" href="{% url 'compras:index' %}">Volver al panel</a>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const buttons = document.querySelectorAll(".cp__toggle");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const inputId = btn.getAttribute("data-toggle-for");
          const input = document.getElementById(inputId);
          if (!input) return;

          const eye = btn.querySelector(".cp__eye");
          const eyeOff = btn.querySelector(".cp__eyeOff");

          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";

          if (eye && eyeOff) {
            eye.style.display = isPassword ? "none" : "block";
            eyeOff.style.display = isPassword ? "block" : "none";
          }

          btn.setAttribute("aria-label", isPassword ? "Ocultar contraseña" : "Mostrar contraseña");
          btn.setAttribute("title", isPassword ? "Ocultar contraseña" : "Mostrar contraseña");
          input.focus();
        });
      });
    })();
  </script>
</body>
</html>

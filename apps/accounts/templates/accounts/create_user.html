{% load static %}
<!--
  Template: create_user.html
  Función: formulario para que un administrador cree nuevos usuarios desde el panel.
  Incluye campos: nombre, email, contraseña, rol y estado activo. Contiene control para
  mostrar/ocultar la contraseña y usa estilos compartidos en login.css.
-->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear usuario</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="cu">
  <div class="login__wrap">
    <div class="login__card">
      <h1 class="login__title">Crear usuario</h1>

      {% if messages %}
        {% for message in messages %}
          <div class="login__alert">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form class="login__form" method="post">
        {% csrf_token %}

        <div>
          <label class="field__label">Nombre</label>
          <input class="field__input" name="nombre" value="{{ nombre|default:'' }}" required />
        </div>

        <div>
          <label class="field__label">Email</label>
          <input class="field__input" type="email" name="email" value="{{ email|default:'' }}" required />
        </div>

        <div>
          <label class="field__label">Contraseña</label>
          <div class="field__passwordWrap">
            <input class="field__input field__input--password" id="password" type="password" name="password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="Debe tener al menos 8 caracteres e incluir mayúsculas, minúsculas, números y caracteres especiales." required />
            <button class="field__togglePass" id="togglePassword" type="button" aria-controls="password" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg class="field__eye" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg class="field__eyeOff" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none;" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2"/>
                <path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.4" stroke="currentColor" stroke-width="2"/>
                <path d="M6.3 6.3C3.8 8.3 2 12 2 12s3.5 7 10 7c2.1 0 3.9-.6 5.4-1.5" stroke="currentColor" stroke-width="2"/>
                <path d="M9.9 4.2C10.6 4.1 11.3 4 12 4c6.5 0 10 8 10 8s-1 2.3-3.1 4.4" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
          <small style="display:block; margin-top:6px; color:#666; font-size:12px;">
            Debe tener al menos 8 caracteres e incluir mayúsculas, minúsculas, números y caracteres especiales.
          </small>
        </div>

        <div>
          <label class="field__label">Rol</label>
          <select class="field__input" name="rol" required>
            <option value="">-- Selecciona --</option>
            <option value="Administrador" {% if rol == "Administrador" %}selected{% endif %}>Administrador</option>
            <option value="Vendedor" {% if rol == "Vendedor" %}selected{% endif %}>Vendedor</option>
            <option value="Bodeguero" {% if rol == "Bodeguero" %}selected{% endif %}>Bodeguero</option>
          </select>
        </div>

        <div>
          <label style="display:flex; gap:8px; align-items:center; font-size:13px;">
            <input type="checkbox" name="activo" value="1" {% if activo %}checked{% endif %}>
            Activo
          </label>
        </div>

        <button class="login__btn" type="submit">Crear</button>

        <a class="cu__back" href="{% url 'compras:index' %}">Volver al panel</a>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');

      if (!passwordInput || !toggleBtn) return;

      toggleBtn.addEventListener('click', function () {
        const eye = toggleBtn.querySelector('.field__eye');
        const eyeOff = toggleBtn.querySelector('.field__eyeOff');
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';

        if (eye && eyeOff) {
          eye.style.display = isHidden ? 'none' : 'block';
          eyeOff.style.display = isHidden ? 'block' : 'none';
        }

        toggleBtn.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
        toggleBtn.setAttribute('title', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
        passwordInput.focus();
      });
    })();
  </script>
</body>
</html>

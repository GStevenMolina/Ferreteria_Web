{% load static %}
<!--
  Recuperación de contraseña por código: solo solicita el correo, y envía un código.
  No muestra ni genera enlaces temporales.
-->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="cu">
  <div class="login__wrap">
    <div class="login__card">
      <h1 class="login__title">Recuperar contraseña</h1>
      {% if messages %}
        {% for message in messages %}
          <div class="login__alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <form class="login__form" method="post">
        {% csrf_token %}
        <div>
          <label class="field__label">Email</label>
          <input class="field__input" type="email" name="email" value="{{ email|default:'' }}" required />
        </div>
        <button class="login__btn" type="submit">Enviar código</button>
      </form>
      <a class="cu__back" href="{% url 'login' %}">Volver al inicio de sesión</a>
    </div>
  </div>
</body>
</html>

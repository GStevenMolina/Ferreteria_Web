{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
  <div class="login__wrap">
    <div class="login__card">
      <div class="login__header">
        <!-- opcional: logo -->
        <!-- <img class="login__logo" src="{% static 'img/logo.png' %}" alt="Logo" /> -->
        <div>
          <h1 class="login__title">Iniciar sesión</h1>
          <p class="login__subtitle">Ingresa tu correo y contraseña para continuar</p>
        </div>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="login__alert">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form class="login__form" method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div>
          <label class="field__label">Email</label>
          <input class="field__input" type="email" name="email" value="{{ email|default:'' }}" required />
        </div>

        <div>
          <label class="field__label">Contraseña</label>
          <input class="field__input" type="password" name="password" required />
        </div>

        <button class="login__btn" type="submit">Entrar</button>

        <p class="login__hint">Si tienes problemas para entrar, revisa tu correo y contraseña.</p>
      </form>
    </div>

    <div class="login__footer">
      Ferretería • Panel de acceso
    </div>
  </div>
</body>
</html>

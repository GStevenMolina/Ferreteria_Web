{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
  </head>

  <body class="login">
    <div class="login__bg"></div>

    <main class="login__wrap">
      <section class="login__card" aria-label="Formulario de inicio de sesión">
        <header class="login__header">
          <!-- Cambia la ruta si tu logo está en otro lugar -->
          <img class="login__logo" src="{% static 'assets/Ferreteria.png' %}" alt="Ferretería Mi Casa" />
          <div class="login__titles">
            <h1 class="login__title">Ferretería Mi Casa</h1>
            <p class="login__subtitle">Acceso al sistema</p>
          </div>
        </header>

        {% if form.errors %}
          <div class="login__alert" role="alert">
            Usuario o contraseña incorrectos.
          </div>
        {% endif %}

        <form class="login__form" method="post" novalidate>
          {% csrf_token %}

          <!-- Soporta ?next=/ -->
          {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
          {% endif %}

          <label class="field">
            <span class="field__label">Usuario</span>
            <input
              class="field__input"
              type="text"
              name="username"
              autocomplete="username"
              autofocus
              required
              value="{{ form.username.value|default:'' }}"
            />
          </label>

          <label class="field">
            <span class="field__label">Contraseña</span>
            <input
              class="field__input"
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </label>

          <button class="login__btn" type="submit">
            Entrar
          </button>

          <p class="login__hint">
            Si no tienes acceso, solicita tu usuario al administrador.
          </p>
        </form>
      </section>

      <footer class="login__footer">
        <small>© {{ now|date:"Y" }} Ferretería Mi Casa</small>
      </footer>
    </main>
  </body>
</html>

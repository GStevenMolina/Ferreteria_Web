<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Código de recuperación - {{ business_name }}</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background:#f6f6f6; margin:0; padding:20px; }
      .card { background:#ffffff; max-width:600px; margin:20px auto; padding:24px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
      .brand { color:#0066cc; font-weight:700; font-size:20px; }
      .code { display:inline-block; margin:14px 0; padding:12px 18px; font-size:20px; letter-spacing:4px; background:#f2f8ff; border-radius:6px; border:1px dashed #cfe3ff; }
      .footer { font-size:12px; color:#666; margin-top:18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">{{ business_name }}</div>
      <h2>Recuperación de contraseña</h2>
      <p>Hemos recibido una solicitud para restablecer la contraseña de tu cuenta. Usa el siguiente código para continuar:</p>
      <div class="code">{{ code }}</div>
    </div>
  </body>
</html>
